<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: the safe-area insets of the phone are honoured,
         so the map and the trip card stay clear of the notch. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Groundwork — live fleet tracking and delivery routes for field operations. Works offline." />
    <!-- The colour of the installed app (the top bar of the launcher). -->
    <meta name="theme-color" content="#d0171e" />
    <!-- Installed on iOS: the app opens without the browser chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Groundwork" />
    <title>Groundwork — Field operations, mapped</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
